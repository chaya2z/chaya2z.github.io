name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim
    outputs:
      skip-deploy: ${{ steps.check-hash.outputs.is-dirty == 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build and upload artifacts
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
          package-manager: pnpm@10
      - name: Check hash
        id: check-hash
        uses: ./.github/actions/check-dist-manifest
        with:
          update-cache: true

  deploy:
    needs: build
    if: needs.build.outputs.skip-deploy == 'false'
    runs-on: ubuntu-slim
    permissions:
      # ref: https://github.com/actions/deploy-pages#security-considerations
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
